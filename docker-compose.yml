services:
  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      # localhost inside the container is the container itself, so use the host-reachable URL
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      UPLOAD_DIR: /uploads
      PORT: 4001
    volumes:
      - uploads:/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  collab:
    image: excalidraw/excalidraw-room:latest
    restart: unless-stopped
    ports:
      - "3003:80"
    environment:
      CORS_ORIGIN: "*"
      NODE_ENV: production

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - collab

volumes:
  uploads:
